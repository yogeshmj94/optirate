services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: optirate
      POSTGRES_USER: optirate
      POSTGRES_PASSWORD: optirate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optirate -d optirate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: